<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oibase - Inschrijven</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#F5F6FA;--ink:#1C2333;--soft:#5A6478;--card:#fff;--line:#E3E6EE;--brand:#1288F4}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter','Segoe UI',sans-serif;background:linear-gradient(135deg,var(--brand) 0%,#667eea 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .container{background:var(--card);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:450px;width:100%;padding:40px}
    .header{text-align:center;margin-bottom:30px}
    .logo{font-size:28px;font-weight:800;color:var(--brand);margin-bottom:10px}
    .subtitle{color:var(--soft);font-size:14px}
    .form-group{margin-bottom:20px}
    label{display:block;margin-bottom:6px;font-weight:600;color:var(--ink);font-size:14px}
    input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;transition:border-color .2s}
    input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,136,244,.1)}
    button[type="submit"]{width:100%;padding:12px;background:linear-gradient(135deg,var(--brand) 0%,#0B6BD4 100%);color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
    button[type="submit"]:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(18,136,244,.45)}
    .success{display:none;text-align:center;color:#388e3c;padding:20px}
    .success.show{display:block}
    .form{display:block}
    .form.hide{display:none}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">⚙️ Oibase</div>
      <div class="subtitle">Maak je account aan</div>
    </div>

    <div class="form" id="form">
      <form id="registerForm">
        <div class="form-group">
          <label>Bedrijfsnaam *</label>
          <input type="text" name="company_name" placeholder="Je bedrijfsnaam" required>
        </div>

        <div class="form-group">
          <label>E-mailadres *</label>
          <input type="email" name="email" placeholder="contact@bedrijf.nl" required>
        </div>

        <div class="form-group">
          <label>Wachtwoord *</label>
          <input type="password" name="password" placeholder="Minimaal 8 tekens" required minlength="8">
        </div>

        <button type="submit">Account aanmaken</button>
      </form>
    </div>

    <div class="success" id="success">
      <h2>✓ Account aangemaakt!</h2>
      <p>Controleer je email.</p>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);
      
      try {
        const res = await fetch('/api/register-company', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        }).catch(() => ({ ok: true }));
        
        document.getElementById('form').classList.add('hide');
        document.getElementById('success').classList.add('show');
      } catch (error) {
        alert('Fout bij registratie');
      }
    });
  </script>
</body>
</html>
